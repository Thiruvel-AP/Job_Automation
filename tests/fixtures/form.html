<!doctype html>
<html><body>
<h1>Apply: AI Engineer</h1>
<form id="application">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" type="email" name="email" required>
  <label for="phone">Phone</label><input id="phone" type="tel" name="phone">
  <label for="li">LinkedIn Profile</label><input id="li" name="urls[LinkedIn]">
  <label for="resume">Resume/CV *</label><input id="resume" type="file" name="resume" required>
  <label for="cl">Cover Letter</label><input id="cl" type="file" name="cover_letter">
  <label for="visa">Will you now or in the future require visa sponsorship? *</label>
  <select id="visa" name="visa" required><option value=""></option><option>Yes</option><option>No</option></select>
  <label for="salary">Salary expectations</label><input id="salary" name="salary">
  <label for="why">Why do you want to work here? *</label><textarea id="why" name="why" required></textarea>
  <label><input type="checkbox" name="privacy" required> I agree to the privacy policy</label>
  <button type="submit" id="submit">Submit application</button>
</form>
<script>document.getElementById('application').addEventListener('submit', e => { e.preventDefault(); document.body.dataset.submitted = '1'; });</script>
</body></html>
