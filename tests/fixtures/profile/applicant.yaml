# Fictional applicant for tests (same shape as config/profile/applicant.yaml). Tests never read the real one.
first_name: Ada
last_name: Lovelace
email: ada.lovelace@example.org
phone: "+44 7700 900123"
location: Bristol, United Kingdom
linkedin: https://www.linkedin.com/in/ada-lovelace-test/
github: https://github.com/ada-lovelace-test
website: https://ada-lovelace-test.example.org/portfolio

# Label regexes → field key above. Matched case-insensitively against <label>, aria-label, placeholder, name.
label_map:
  first_name: ['first\s*name', 'given\s*name', 'forename']
  last_name: ['last\s*name', 'surname', 'family\s*name']
  email: ['e-?mail']
  phone: ['phone', 'mobile', 'telephone']
  location: ['^location', 'city', 'current location']
  linkedin: ['linkedin']
  github: ['github']
  website: ['website', 'portfolio']

# Labels that must always be left to you, even if a key above would match.
never_fill: ['sponsor', 'visa', 'right to work', 'work authori[sz]ation', 'salary', 'compensation',
             'notice', 'gender', 'ethnic', 'disab', 'veteran', 'criminal', 'convict', 'pronoun',
             'sexual', 'religio', 'nationality', 'citizenship', 'clearance', 'why do you want', 'cover letter']

visa:
  home: GB
  remote:
    label: "Remote"                     # the only wording shown for a remote role at home
    unrestricted_uses: home
  by_country:
    GB:
      right_to_work: true
      sponsorship_now: false
      sponsorship_future: true
      summary: "I have completed my MSc in Data Science at the University of Northfield and am moving onto the UK Graduate visa (2 years), so I won't need sponsorship for the next 2 years. After that I'd welcome Skilled Worker sponsorship and am flexible on how we arrange it."
    default:
      right_to_work: false
      sponsorship_now: true
      sponsorship_future: true
      summary: "I would need a work visa for {country} and am open to sponsorship."

equal_opportunities:
  ethnicity:
    answer: "Asian - Indian"
    match_any:            # first option on the form that matches, in this order
      - "Asian or Asian British - Indian"
      - "Asian, Asian British or Asian Welsh: Indian"
      - "Indian"
      - "Asian"
  # Only questions listed here get filled. Gender, disability, religion etc. are left blank for you.
