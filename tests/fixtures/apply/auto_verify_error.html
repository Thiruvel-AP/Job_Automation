<!doctype html>
<html><head><meta charset="utf-8"><title>Apply</title></head><body>
<!-- What Greenhouse shows when a bot check turned the browser away: a form, and under it the message. Counts every touch in window.__touched. -->
<h1>Apply</h1>
<form id="application" novalidate>
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="email">Email *</label><input id="email" type="email" name="email" required>
  <button type="submit" id="submit">Submit application</button>
</form>
<p id="notice">There was an error verifying your application. Please try again.</p>
<script>
  window.__clicks = 0; window.__touched = 0;
  for (const ev of ['click', 'mousedown', 'focus', 'keydown'])
    document.addEventListener(ev, () => { window.__touched += 1; }, true);
  document.getElementById('application').addEventListener('submit', e => { e.preventDefault(); window.__clicks += 1; });
</script>
</body></html>
