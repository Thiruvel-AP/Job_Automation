<!doctype html>
<html><head><meta charset="utf-8"><title>Acme - react-select country</title></head><body>
<!-- A react-select-shaped drop-down (an input with role=combobox whose option list is built while you type), for tests/apply/test_formagent.py.
     window.__keys = the time of every key typed into it; window.__chosen = the option clicked. The list shows only the options that contain what was typed. -->
<form id="app" novalidate>
  <label for="name">Full name *</label><input type="text" id="name" name="name" required>
  <label for="email">Email *</label><input type="email" id="email" name="email" required>
  <label for="resume">Resume/CV *</label><input type="file" id="resume" name="resume" required>
  <label for="country">Country *</label>
  <div class="select__control">
    <input id="country" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" name="country_text">
    <div id="list" hidden></div>
    <span id="shown"></span>
  </div>
  <button type="submit">Submit application</button>
</form>
<script>
  window.__keys = []; window.__chosen = '';
  const COUNTRIES = ['Germany', 'Uganda', 'Ukraine', 'United Arab Emirates', 'United Kingdom', 'United States'];
  const input = document.getElementById('country'), list = document.getElementById('list');
  const render = () => {
    const q = input.value.toLowerCase();
    list.innerHTML = '';
    for (const c of COUNTRIES.filter(c => c.toLowerCase().includes(q))) {
      const o = document.createElement('div'); o.setAttribute('role', 'option'); o.className = 'select__option'; o.textContent = c;
      o.addEventListener('click', () => { window.__chosen = c; document.getElementById('shown').textContent = c; input.value = ''; list.hidden = true; });
      list.appendChild(o);
    }
    list.hidden = false;
  };
  input.addEventListener('keydown', () => window.__keys.push(performance.now()));
  input.addEventListener('input', render);
  document.getElementById('app').addEventListener('submit', e => e.preventDefault());
</script>
</body></html>
