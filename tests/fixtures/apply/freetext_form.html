<!doctype html>
<html><head><meta charset="utf-8"><title>Apply: AI Engineer</title></head><body>
<!-- A Greenhouse-shaped form with two required free-text questions, for tests/test_autoapply_freetext.py. Query: ?noconfirm = stay after Submit. -->
<h1>Apply: AI Engineer</h1>
<form id="application" novalidate>
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" type="email" name="email" required>
  <label for="resume">Resume/CV *</label><input id="resume" type="file" name="resume" required>
  <label for="q1">Describe an LLM feature you are proud of (max 60 words) *</label>
  <textarea id="q1" name="q1" required></textarea>
  <label for="q2">What was the hardest part of building it (1-2 sentences) *</label>
  <textarea id="q2" name="q2" maxlength="600" required></textarea>
  <label for="q3">Anything else you want us to know?</label>
  <textarea id="q3" name="q3"></textarea>
  <button type="submit" id="submit">Submit application</button>
</form>
<script>
  window.__clicks = 0;
  const q = location.search;
  document.getElementById('application').addEventListener('submit', e => {
    e.preventDefault();
    window.__clicks += 1;
    if (q.includes('noconfirm')) return;
    location.href = 'auto_done.html';
  });
</script>
</body></html>
