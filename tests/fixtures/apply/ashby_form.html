<!doctype html>
<html><head><meta charset="utf-8"><title>Senior AI Engineer - Limbic</title></head><body>
<!-- An Ashby-shaped application form for tests/apply/test_assist_filler.py: ONE "Name" field (Ashby's _systemfield_name) next to separate
     First name / Last name fields, a free-text question nobody but the person can answer, and one question answers.yaml answers. -->
<h1>Senior AI Engineer</h1>
<form id="application" novalidate>
  <label for="_systemfield_name">Name</label><input id="_systemfield_name" name="_systemfield_name" type="text" required>
  <label for="fn">First name</label><input id="fn" name="first_name" type="text">
  <label for="ln">Last name</label><input id="ln" name="last_name" type="text">
  <label for="_systemfield_email">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email" required>
  <label for="phone">Phone number</label><input id="phone" name="phone" type="tel">
  <label for="li">LinkedIn</label><input id="li" name="linkedin" type="text">
  <label for="gh">GitHub</label><input id="gh" name="github" type="text">
  <label for="company">Company name</label><input id="company" name="company_name" type="text">
  <label for="_systemfield_resume">Resume</label><input id="_systemfield_resume" name="_systemfield_resume" type="file" required>
  <label for="notice">Notice period</label><input id="notice" name="notice" type="text">
  <label for="llm">Describe an LLM feature you have shipped to production and what you learned from it *</label>
  <textarea id="llm" name="llm" required></textarea>
  <button type="submit" id="submit">Submit Application</button>
</form>
<script>
  window.__clicks = 0;
  document.getElementById('application').addEventListener('submit', e => { e.preventDefault(); window.__clicks += 1; });
</script>
</body></html>
