[project]
name = "career-ops"
version = "2.0.0"
description = "Local job-search pipeline: discover → triage → tailor (fact-bank only) → human review → assisted apply"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "playwright>=1.44",
  "dnspython>=2.4",          # the e-mail domain check (careerops/contacts.py); no other part of the pipeline needs it
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5"]   # -n auto: the suite in parallel (tests use tmp_path only)

[project.scripts]
careerops = "careerops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["careerops"]

[tool.pytest.ini_options]
addopts = "-n auto"   # the suite in parallel (tests use tmp_path only)
markers = [
  "slow: runs xelatex or drives Chromium (PDF rendering); deselect with -m 'not slow' for a light run (< ~2 GB RAM)",
]
