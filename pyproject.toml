[project]
name = "career-ops"
version = "2.0.0"
description = "Local job-search pipeline: discover → triage → tailor (fact-bank only) → human review → assisted apply"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
careerops = "careerops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["careerops"]

[tool.pytest.ini_options]
markers = [
  "slow: runs xelatex or drives Chromium (PDF rendering); deselect with -m 'not slow' for a light run (< ~2 GB RAM)",
]
