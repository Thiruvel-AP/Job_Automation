# CV / letter typography, applied when the PDF is rendered (careerops/tailoring/typography.py). Never to the fact bank, and never before the
# faithfulness / claim checks: those run on the original wording; only the text that reaches the page is tidied.
#
# Em dashes (and "--", and a spaced " - ") never reach the PDF: each becomes a comma, a colon or parentheses (code decides by grammar).
# Hyphens: an intra-word hyphen is never removed (tool-calling, end-to-end, five-person stay as written). The old rule that closed every
# word-word up was a bug (12 Nov 2026 dry run): the PDFs lost "tool calling" etc. that the report and the ATS keywords spell with a hyphen.
# `rewrite` holds special spellings only, "hyphenated form": "what the page shows"; empty on purpose.

rewrite: {}

# Never touched, whatever the table or any other rule says (matched case-insensitively as a whole word). URLs and e-mail addresses
# are always protected, and so are number ranges such as 3.9-3.11 (those keep their en dash).
protected:
  - scikit-learn
  - k-means
  - k-NN
  - TF-IDF
  - gpt-oss
  - faster-whisper
  - Skip-gram
  - CIFAR-10
  - Thiruvel-AP
  - thiruvel-a-p
