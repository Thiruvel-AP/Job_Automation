paths:
  # Everything under data/ is generated, git-ignored, and re-creatable by `careerops init`.
  db: data/careerops.db
  register_dir: data/register             # daily UKVI snapshots: YYYY-MM-DD.csv.gz
  sponsors_csv: data/register/latest.csv  # most recent register CSV (used by gates)
  companies_house_dir: data/companies_house  # monthly bulk zips: YYYY-MM/
  outputs: data/outputs                   # one folder per job: CV.tex/.pdf, Cover_Letter.tex/.pdf, report.json
  excel: data/exports/companies.xlsx      # export view only — SQLite is the source of truth
  learning: data/exports/learning_list.md
  preferences: data/feedback/preferences.jsonl
  browser_profile: data/browser-profile   # Playwright's persistent login state for ATS sites
  logs: data/logs
  fact_bank: config/profile/fact_bank.yaml
  applicant: config/profile/applicant.yaml
  # archive of submitted applications — the user's own folder D:\Professional\UK\Companies, outside the repo.
  # Append-only: code only ever creates new folders/files here. Only `careerops init` creates the root.
  applications: /mnt/d/Professional/UK/Companies
  judge: data/judge                       # review.judge: log.csv (the judge's verdict beside your decision) and verdicts/ (cache)
  jds: data/jds                           # `careerops live`: inbox/ (JD .txt files to do), done/ and rejected/ (+ .reason.txt)
  live: data/live                         # `careerops live`: state.json (resume) and one summary .md per session
  discover: data/discover                 # `careerops discover`: boards/ (posting lists, 6 h), company_boards.json, gmail_seen.json, runs.jsonl
  robots: data/robots                     # robots.txt rules per host, <host>.json, kept 24 h before a page is fetched (discovery/robots.py)
  secrets: data/secrets                   # gitignored (data/): the Gmail OAuth client file and token (`discover --gmail-alerts`); never in git
  tmp: data/tmp                           # staging for archive copies; safe to delete while no command is running
  calibration: data/calibration           # M5 calibration JDs, manifest, reports (careerops calibrate)
  # Frozen keyword lists, one <jd-id>.yaml per calibration JD (`careerops calibrate --freeze-keywords`). They are
  # hand-curated INPUTS that decide every later run's ceilings, so they live under config/ and are tracked in git, not in
  # data/ with the runtime output. `calibrate` reads them whenever the folder exists and refuses to run if a JD's file
  # is missing; `--mock` redirects this folder under mock_root like every other generated path.
  frozen_keywords: config/calibration/keywords
  # `--mock` runs redirect every path above that points at generated data (db, outputs, excel, archive, ...) under
  # this folder, so a mock run cannot touch real jobs. fact_bank and applicant stay read-only. Safe to delete.
  mock_root: data/mock

sponsors:
  # The register's CSV link changes daily; we scrape the publication page for it.
  page_url: https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers
  route: Skilled Worker
  fuzzy_threshold: 0.92            # difflib ratio on normalised names; a match below 1.0 is stored as fuzzy(score), never as exact

companies:                         # Track A — sponsor-first company discovery (M2/M3)
  ch_bulk_page: https://download.companieshouse.gov.uk/en_output.html
  sponsor_ratings: ["A"]           # A-rated only (B = on a Home Office compliance action plan)
  sic_allow:                       # SIC 2007 codes; descriptions verified against the ONS condensed list
    software: [58290, 62011, 62012, 62020, 62030, 62090]
    data: [63110, 63120]
    finance: [64191, 64999, 66190]
    insurance: [65110, 65120]
    pharma_research: [21200, 72110, 72190, 72200]
    consulting: [70229]
    health: [86101, 86900]
  public_sector_pattern: '\b(nhs|university|council|trust|authority|agency|college|ministry)\b'
  probe_rate_per_s: 1.0
  probe_limit_per_run: 300
  reprobe_after_days: 30

sources:
  greenhouse: []                   # board tokens, e.g. [monzo, deliveroo] — slug in job-boards.greenhouse.io/<slug>
  lever: []                        # site slugs, e.g. [palantir]  — slug in jobs.lever.co/<slug>
  lever_eu: []                     # jobs.eu.lever.co/<slug>
  ashby: []                        # e.g. [synthesia] — slug in jobs.ashbyhq.com/<slug>
  adzuna:
    enabled: false                 # needs ADZUNA_APP_ID / ADZUNA_APP_KEY env vars (free at developer.adzuna.com)
    queries: ["data scientist", "machine learning engineer", "ai engineer", "applied scientist"]
    pages_per_query: 2
    max_days_old: 7

roles:
  # Lower tier = higher priority. Patterns are case-insensitive regexes on the job TITLE.
  # Families are tried in tier order, so an ambiguous title ("Data Scientist / ML Engineer") takes the higher tier.
  # `projects` = preferred fact-bank project ids for that family (a prior for tailoring, not an order);
  # every id must exist in fact_bank.yaml or triage/tailor stop with a clear error.
  families:
    - {name: data_scientist, tier: 1, headline: Data Scientist,
       title: ['data scien', 'decision scien'],
       projects: [churn, bitcoin, lloyds, gtaigraph]}
    - {name: ai_engineer, tier: 1, headline: AI Engineer,
       title: ['\bai engineer', '\bai/ml engineer', '\b(llm|genai|generative ai) engineer', 'applied ai', '\bai (software )?(engineer|developer)', 'agent(ic)? (ai )?engineer'],
       projects: [agenticfriend, mcpsearch, coverfit, lloyds]}
    - {name: ml_engineer, tier: 2, headline: Machine Learning Engineer,
       title: ['machine learning engineer', '\bml engineer', '\bmlops', 'applied scientist', '\bnlp engineer'],
       projects: [agenticfriend, bitcoin, gtaigraph, coverfit]}
    - {name: data_analyst, tier: 3, headline: Data Analyst,
       title: ['data analyst', 'insights? analyst', 'product analyst', 'analytics engineer', '\bbi analyst', 'business intelligence analyst', 'reporting analyst'],
       projects: [churn, lloyds, bitcoin, coverfit]}
  levels:
    # Junior and mid only. `\bintern(ship)?\b` (not `intern`) so "International" / "Internal" still pass.
    exclude: ['\bsenior\b', '\bsr\.?\b', '\bstaff\b', '\bprincipal\b', '\blead\b', '\bhead of\b', '\bdirector\b',
              '\bmanager\b', '\bvp\b', '\b(iii|iv)\b', '\bintern(ship)?\b']
  floor: 0.70                 # same as scoring.band[0]; jobs whose honest ceiling can't reach it queue last
  tier3_max_share: 0.20       # tier 3 gets at most 20 % of a run's tailoring slots unless tiers 1–2 run out

gates:
  locations_ok: ['united kingdom', '\buk\b', 'england', 'london', 'bristol', 'remote', 'manchester', 'cambridge', 'oxford', 'edinburgh', 'bath', 'cardiff', 'birmingham', 'leeds', 'scotland', 'wales']
  max_years_required: 3
  require_sponsor_match: true      # note (never skip, never block) on the review screen a job whose employer is not on the sponsor register, or when no register snapshot exists
  # (regex, action, reason). action: skip = never apply; flag = still tailor, but review shows the reason in red.
  # Sponsorship is deliberately NOT a rule here: a JD that says "no sponsorship" or "right to work without sponsorship" keeps its
  # job eligible; it only lowers the priority weight S (priority.sponsor_weights below) and is shown as an info line.
  jd_rules:
    - ['\b(sc|dv|security) clearance\b', flag, 'Clearance mentioned — check residency/eligibility']
    - ['british (citizen|national)s? only|must be a british', skip, 'Nationality restriction']
    - ['\bon[- ]call\b', flag, 'On-call duties mentioned']
    - ['site reliability|\bsre\b|observability ownership', skip, 'SRE-framed role (standing exclusion)']
    - ['direct reports|line manag(e|ement)|people manag', skip, 'People-management requirement (standing exclusion)']

discover:
  # `careerops discover --ats --reed --adzuna --gmail-alerts`: every ad that passes goes to data/jds/inbox/ (see discovery/discover.py).
  # Kept: a title in roles.families and a UK or remote-UK place. Dropped: closed postings and jobs already in the DB, the inbox/done/
  # rejected folders or the application archive. Sponsorship is never a filter (priority: below).
  cache_hours: 6                   # a board's posting list is reused this long
  max_new_per_run: 40              # at most this many new inbox files per run (--limit)
  alert_probes_per_run: 12         # companies named by alerts / Adzuna whose board is looked for by probing slugs, per run
  # `discover --ats` looks for a job board of these companies, in this order: (1) the folder names directly under paths.applications
  # (names only, nothing inside is read), (2) `sources` below, (3) sponsor-register companies, only if they are also in (1) or (2).
  sources: []                      # employers to look for beside the archive folders: ["Monzo", "Wise", {name: "Octopus Energy"}]
  ats:
    board_cache_days: 30           # a board token's answer, found or not, is reused this long (paths.discover/boards.json)
  reed:
    queries: ["data scientist", "machine learning engineer", "ai engineer", "applied scientist"]
    location: null                 # Reed's locationName; null = all of the UK
    pages_per_query: 1             # pages of 100 per query, for direct employers and again for agencies
    details_per_run: 60            # full ads fetched per run (one request each, one per second)
  gmail:
    senders: [linkedin, cvlibrary, indeed, reed]   # job-alert emails from these (read-only Gmail API)
    query_days: 14
    max_messages: 60

priority:
  # P = F x S x R orders the live inbox, discover's listing and status (discovery/priority.py). F is the honest ATS ceiling; S and R are
  # below. Sponsorship is a weight, never a filter: I hold the UK Graduate visa, so every one of these jobs stays eligible.
  sponsor_weights:
    exact: 1.00            # employer found on the sponsor register by exact name
    fuzzy: 0.90            # found by a near match
    unknown: 0.75          # not on the register, a recruitment agency, or no register loaded
    no_sponsorship: 0.65   # the JD itself says it does not sponsor / requires the right to work without sponsorship
  recency_days: 14         # R = exp(-days_since_posted / 14); 1.0 when the posting date is unknown

files:
  name_style: full   # full = identity.name, short = first word of identity.name (CV / cover-letter file names)

scoring:
  band: [0.70, 0.85]
  max_attempts: 3
  max_keywords: 25            # JD keywords kept (most important by weight, then by how often the JD says them): a short, specific list a one-page CV can honestly hit
  required_weight: 2.0
  preferred_weight: 1.0
  max_pages: 2                # two full pages by default (recruiters respond to a 2-page CV); the shrink loop runs only above this. `--one-page` forces 1 with the old template
  min_fill_page2: 0.65        # page 2 must be at least this full (y of its last text line / text-area height, measured from the PDF); bullets are added until it is, or run out. The reference 2-page CV fills ~70% of page 2 and all experience bullets are already used, so a higher floor would need filler
  cv_bullets:                 # bullets per experience entry on the two-page CV: [min, max] by greedy keyword gain, then more only to fill page 2
    most_recent: [4, 5]       # the first (newest) entry
    other: [3, 4]             # every other entry; an entry with fewer bullets in the fact bank just shows them all
  cv_projects: 3              # projects on the two-page CV
  cv_project_bullets: [2, 3]  # [min, max] bullets per project (a project with fewer shows them all)
  cv_fill_extra_projects: false  # false = the CV never shows more than cv_projects projects (fill adds bullets to those, then experience); true = once those are used up, a further project may be added to fill page 2
  max_skill_groups: 5         # grouped skill rows besides the pinned `skills.core` row; the groups least relevant to the JD are left off
  bullet_dedupe_jaccard: 0.6  # a bullet whose word-set overlap (Jaccard) with an already chosen bullet reaches this is not added
  letter_max_words: 250

letter:
  # off = no letter is asked for: no letter call is made, no letter PDF is written, review says "Letter: off" and approving needs
  # no extra words. draft = the model drafts one from the evidence as fields (method, data, outcome), not as the bullet
  # sentence, and every letter check still applies. Off by default: write your own, or turn this on to get a draft.
  mode: "off"                # quoted: an unquoted off is the boolean false in YAML
  # {company} = job company; {team} = " <team name>" when the JD names one (leading space included), else "".
  greeting: "Hi {company}{team} team"
  greeting_fallback: "Dear {company} hiring team"     # used when the JD names no team
  # The closing question is written here, never by the model: a small model's call to action was the most common reason a
  # letter was rejected. {team} = the team name the JD gives (no leading space).
  closing: "Could we find twenty minutes to talk about where I could contribute first on the {team} team at {company}?"
  closing_fallback: "Could we find twenty minutes to talk about where I could contribute first at {company}?"     # no team named
  signoff: "With regards"
  # What a letter becomes when all 3 drafts were rejected by the checks. none = no letter is produced: no PDF, review shows
  # "NO LETTER", and approving needs the words 'no letter' (regenerate with `l`, write your own, or apply without).
  # template = the deterministic template letter is written instead, flagged as a fallback in review.
  on_failure: none

review:
  # off = no judge. shadow = a second model reads the CV and letter, its verdict is shown on the review screen and logged beside
  # your decision (paths.judge/log.csv); `careerops judge-report` says how well it agrees with you. gate = a judge "yes" approves
  # the job without the prompt; refused in code until the log holds 60 human-labelled reviews and not one false approve (judge
  # yes, you no). A judge "no" always comes to you. The judge model is llm.models.judge (local Ollama qwen2.5-7b-8k), and must be
  # another family than gpt-oss.
  judge: shadow               # off | shadow | gate (quote "off": an unquoted off is the boolean false in YAML)

llm:
  # Tried in order; on 429 / 5xx / quota exhausted the router falls through to the next.
  # All three speak the OpenAI chat-completions dialect.
  providers:
    - name: groq
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      model: openai/gpt-oss-20b    # check console.groq.com/docs/models — free-tier model list changes
      # Context window in tokens (prompt + completion). Before each request the router estimates input + max_tokens; a
      # request that would not fit is not sent to this provider (it goes to the next, or fails with the reason).
      # 131072 per Groq's model docs; its 8K TPM limit is separate and already paced by tpm below.
      context_tokens: 131072
      # Limits the router paces itself to. Groq's x-ratelimit-* response headers override them while present; these are
      # used before the first reply and when headers are missing. tpm and rpm default to 8000 and 30 if left out;
      # null/0 = unlimited. tpd = tokens per day: a job is not started if its estimated cost no longer fits.
      # Free tier per Groq docs: 30 RPM, 1K RPD, 8K TPM, 200K TPD (console.groq.com/settings/limits).
      tpm: 8000
      rpm: 30
      rpd: 1000
      tpd: 200000
      json_mode: true
      # gpt-oss is a reasoning model: hidden reasoning tokens count against max_tokens. "low" keeps them small and
      # include_reasoning: false drops the reasoning text from the reply. Both are sent in the request body; they
      # default to low/false for any gpt-oss model, and to not sent for other models.
      reasoning_effort: low
      include_reasoning: false
    - name: ollama
      base_url: http://localhost:11434/v1
      api_key_env: null
      # Built from config/ollama/Modelfile (FROM qwen2.5:7b-instruct, num_ctx 8192): `ollama create qwen2.5-7b-8k -f
      # config/ollama/Modelfile`. The OpenAI /v1 endpoint cannot set num_ctx and Ollama's default is 4096, so the
      # context lives in the Modelfile. ~4.7 GB Q4_K_M, fits the RTX 4060's 8 GB at 100% GPU. `careerops doctor` checks
      # the model exists and that its num_ctx is at least context_tokens.
      model: qwen2.5-7b-8k
      context_tokens: 8192         # must equal the Modelfile's num_ctx; Ollama silently truncates a longer prompt
      tpm: null                    # local model: no token budget to pace
      rpm: 1000
      rpd: 1000000
      json_mode: true
  # Completion cap per task. Groq admits a call against the token budget as input + max_tokens, so a tight cap lets
  # more calls through per minute. A reasoning model spends part of it thinking; if a task is cut off the router says
  # which entry to raise. `default` covers any task not listed.
  max_tokens:
    extract_keywords: 2000
    rephrase_bullets: 1200     # <= 5 reworded bullets per call; a reasoning model also spends some of it thinking
    judge: 800                 # {would_send, score, issues}: a short JSON answer
    cover_letter: 3000         # gpt-oss-20b spends reasoning tokens first; run 152700 (Zone & Co) was cut off at 1500
    tailor_profile: 600
    default: 1000
  # Estimated tokens for tailoring one job (keywords + profile + rephrase batches + letter; a below-band retry adds
  # batches). Before each job the router checks today's tokens + this against every provider's tpd; none left -> use
  # the next provider, else stop the run. 10000: calibration round 1 measured a mean of 6,911 and a max of 8,378
  # tokens per JD.
  job_token_estimate: 10000
  # Tasks that may only run on the named providers. cover_letter is written by Groq's model alone: the local model's
  # letters were not fit to send. When none of the named providers can take the call (no key, daily budget spent, rate
  # limited) the CV is still built and the job waits as status `letter_pending` until `careerops tailor` finds the budget
  # back; no other provider ever writes the letter. Tasks not listed here use every provider, in order.
  task_providers:
    cover_letter: [groq]
    judge: [ollama]            # the judge's model runs on this provider only; no other provider's model may answer for it
  # A task may use another model than its provider's own `model`: {task: {provider, model}}. The cover letter is written by
  # the larger gpt-oss-120b on Groq (a small model's letters were the ones most often rejected by the checks, which are
  # unchanged); every other task keeps the provider's model. Groq limits each model on its own, so the router counts, paces
  # and budgets this one under its own key "groq/openai/gpt-oss-120b"; the review screen lists tokens per model, and
  # `careerops doctor` / `llm-check` send it a tiny request to see that it answers.
  models:
    cover_letter: {provider: groq, model: openai/gpt-oss-120b}
    # The judge must be a different family from the generator (gpt-oss): the local Ollama qwen2.5-7b-8k (the ollama provider's
    # own model, 8192-token context). Groq's llama-3.3-70b-versatile answered 404 model_not_found for this account, and a local
    # judge spends no quota and sends nothing out. The judge input is fitted to that context (review/judge.py); `careerops
    # doctor` sends the model a tiny request. Ollama down or an answer that is not JSON: retried once, then "no verdict"
    # (logged); that never blocks a review.
    judge: {provider: ollama, model: qwen2.5-7b-8k}
  # Tokens a letter alone needs (up to three cover_letter drafts: a first and two retries), for finishing a
  # `letter_pending` job. A draft was ~1.5K tokens in the first Monzo live run, so three fit.
  letter_token_estimate: 5000
  # Every task runs at temperature 0 with a fixed seed: a small model that is asked the same question should answer the
  # same way, so a calibration run (careerops calibrate) measures the prompts, not the dice. A provider entry may set its
  # own `seed` (null = send none, for a provider that rejects it).
  temperature: 0
  seed: 7
  timeout_s: 120
  # A 429 is retried after its Retry-After (else 2 s, 4 s, 8 s). A Retry-After longer than this (a spent daily quota)
  # is not waited for; the router goes straight to the next provider.
  max_retry_wait_s: 60
