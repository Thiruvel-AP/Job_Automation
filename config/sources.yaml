  - {id: google-deepmind, regions: [any], name: Google DeepMind, url: 'https://deepmind.google/about/careers/', country: multi, method: gmail_alerts, domains: [deepmind.google, greenhouse-mail.io, greenhouse.io], subject_contains: [DeepMind], note: 'Disabled 2026-10-20: not on the user''s list; its alert domains are shared with every Greenhouse employer. Was: Greenhouse token NOT found: boards-api.greenhouse.io/v1/boards/{deepmind, googledeepmind, google-deepmind, deepmindtechnologies, deepmind-technologies} all answered 404 on 2026-10-13, though job-boards.greenhouse.io/deepmind pages exist. Alerts only (sender domains unverified; greenhouse domains are shared, hence subject_contains). Re-try a token with method: greenhouse if DeepMind publishes one.', enabled: false}
