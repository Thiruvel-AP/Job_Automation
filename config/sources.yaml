# Source registry: every place careerops looks for jobs, and HOW (docs/IMPLEMENTATION.md, "Source registry").
# One entry per source. `careerops discover` and `careerops sources check` run a health check on each and save the table
# to data/discover/health/<date>.csv. Only allowed access is used: public/official APIs, pages robots.txt allows, your own
# Gmail read-only. A 401/403 or a robots.txt "no" stops that source and is never worked around.
#
#   id        short unique slug (a-z, 0-9, -)
#   name      what the health table shows
#   url       the source's home page (documentation only; never fetched unless the method needs it)
#   country   ISO code of the country the source lists jobs for, or `multi` (many countries; each job's own place is read)
#   method    greenhouse | ashby | lever | reed | jobbank_csv | gmail_alerts | dedupe_only
#               greenhouse / ashby / lever   the public job-board API; with `token` that one company's board, without it the
#                                            boards `discover --ats` finds for your archive companies
#               reed                         the Reed Jobseeker API (REED_API_KEY in .env)
#               jobbank_csv                  Canada's Job Bank open-data monthly CSV (`discover --jobbank`)
#               gmail_alerts                 the job-alert emails of this source, read through the read-only Gmail API
#               dedupe_only                  never searched; its list of jobs you applied to is only used to skip duplicates
#   domains   (gmail_alerts) sender domains of the alert emails; any other method may also list them to read its alerts
#   subject_contains   (optional) the alert is this source's only when the subject has one of these words (a shared sender)
#   parser    (optional) linkedin | cvlibrary | indeed | reed: the dedicated alert parser; without it a generic one reads the links
#   token     (greenhouse | ashby | lever) the company's board token
#   dataset   (jobbank_csv) the open.canada.ca dataset id
#   enabled   false = listed but skipped (no check, no search)
#   note      what was verified and what was not
#
# Sender domains marked "unverified" are my best knowledge of where the alerts come from, not read off a real email: run
# `careerops sources check`; "alerts 7d = 0" for a source you receive alerts from means its domain here is wrong.
sources:
  - {id: linkedin, regions: [any], name: LinkedIn, url: 'https://www.linkedin.com/jobs', country: multi, method: gmail_alerts, domains: [linkedin.com], parser: linkedin, note: 'Never fetched (its robots.txt disallows automation); alert emails only. Verified 2026-10-20: jobalerts-noreply@linkedin.com, about one mail every 2 h. Each job must be resolved to the employer''s own page.'}
  - {id: cv-library, regions: [uk], name: CV-Library, url: 'https://www.cv-library.co.uk', country: GB, method: gmail_alerts, domains: [cv-library.co.uk], parser: cvlibrary, note: 'Alert emails; a CV-Library page is fetched only where its robots.txt allows. Verified 2026-10-20: Admin@careers.cv-library.co.uk and Admin@notify.cv-library.co.uk (21 threads in 60 d). The notify. threads have several messages each and look like recruiter replies, not alerts: make sure they are not parsed as job alerts.'}
  - {id: aiapply, regions: [any], name: AIApply, url: 'https://aiapply.co', country: multi, method: dedupe_only, note: 'Disabled 2026-10-20: AIApply has 0 recorded applications, and the CSV reader reported no company/title columns. Re-enable if you ever apply through it. Was: Never searched. data/aiapply_applied.csv (paths.aiapply_applied; company + title columns) is used to skip jobs it already applied to.', enabled: false}
  - {id: greenhouse, regions: [any], name: Greenhouse boards, url: 'https://boards.greenhouse.io', country: multi, method: greenhouse, note: 'No token: only the Greenhouse boards `discover --ats` finds for the companies in your archive and discover.sources. Lever and Ashby need the same treatment (no generic entry yet).'}
  - {id: indeed-uk, regions: [uk], name: Indeed UK, url: 'https://uk.indeed.com', country: GB, method: gmail_alerts, domains: [jobalert.indeed.com, indeed.com, indeed.co.uk], parser: indeed, note: 'Alert emails only; indeed pages are never fetched. Verified 2026-10-20: donotreply@jobalert.indeed.com (a subdomain of indeed.com), about one mail an hour. Check `sources check` shows alerts 7d > 0.'}
  - {id: glassdoor-uk, regions: [uk], name: Glassdoor UK, url: 'https://www.glassdoor.co.uk', country: GB, method: gmail_alerts, domains: [glassdoor.com, glassdoor.co.uk], note: 'Disabled 2026-10-20: not on the user''s list; 0 alert emails in 60 d. Was: Alert emails only (generic parser; sender domains unverified).', enabled: false}
  - {id: wttj, regions: [any], name: Welcome to the Jungle, url: 'https://www.welcometothejungle.com', country: multi, method: gmail_alerts, domains: [welcometothejungle.com], note: 'Alert emails only. Domain verified 2026-10-20 (welcome@, no-reply@, help@welcometothejungle.com) but only 3 mails in 120 d, so no job alert is set up yet: create one on the site. robots.txt has ''Disallow: /*?'', so a link with a query string must not be fetched; resolve the job to the employer''s own page.'}
  - {id: wellfound, regions: [any], name: Wellfound, url: 'https://wellfound.com', country: multi, method: gmail_alerts, domains: [wellfound.com, angel.co], note: 'Alert emails only. 0 mails from wellfound.com or angel.co in 120 d, so no alert is set up and the domain is still unverified: create an alert, then run `sources check`. robots.txt disallows /search and the ?jobId= / ?role= forms.'}
