  - {id: seek-nz, regions: [nz], name: SEEK NZ, url: 'https://www.seek.co.nz', country: NZ, method: gmail_alerts, domains: [seek.co.nz], note: 'Disabled 2026-10-20: not on the user''s list. Was: Alert emails only (generic parser; sender domain unverified).', enabled: false}
  - {id: mycareersfuture, regions: [sg], name: MyCareersFuture, url: 'https://www.mycareersfuture.gov.sg', country: SG, method: gmail_alerts, domains: [mycareersfuture.gov.sg], note: 'Disabled 2026-10-20: not on the user''s list. Was: Alert emails only (generic parser; sender domain unverified).', enabled: false}
  - {id: govuk-fja, regions: [uk], name: GOV.UK Find a Job, url: 'https://findajob.dwp.gov.uk', country: GB, method: gmail_alerts, domains: [findajob.dwp.gov.uk], note: 'Alert emails only. 0 mails from findajob.dwp.gov.uk in 120 d, so no alert is set up. notifications.service.gov.uk was REMOVED: it also carries unrelated Home Office mail, and the pipeline must not read it. A robots.txt fetch of this site was refused on 2026-10-20: never fetch its pages.'}
