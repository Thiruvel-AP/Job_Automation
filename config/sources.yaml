  - {id: stepstone-de, regions: [de], name: StepStone DE, url: 'https://www.stepstone.de', country: DE, method: gmail_alerts, domains: [stepstone.de], note: 'Disabled 2026-10-20: not on the user''s list; UK-only search for now. Was: Alert emails only (generic parser; sender domain unverified).', enabled: false}
  - {id: stepstone-nl, regions: [nl], name: StepStone NL, url: 'https://www.stepstone.nl', country: NL, method: gmail_alerts, domains: [stepstone.nl], note: 'Disabled 2026-10-20: not on the user''s list; UK-only search for now. Was: Alert emails only (generic parser; sender domain unverified).', enabled: false}
  - {id: irishjobs, regions: [ie], name: IrishJobs, url: 'https://www.irishjobs.ie', country: IE, method: gmail_alerts, domains: [irishjobs.ie], note: 'Disabled 2026-10-20: not on the user''s list. Was: Alert emails only (generic parser; sender domain unverified).', enabled: false}
  - {id: jobbank-ca, regions: [ca], name: Job Bank Canada, url: 'https://www.jobbank.gc.ca', country: CA, method: jobbank_csv, dataset: ea639e28-c0fc-48bf-b5dd-b8899bd43072, note: 'Disabled 2026-10-20: Canada, not on the user''s list; also lists titles only (no employer, no ad text). Was: Open-data monthly CSV (Open Government Licence - Canada). Verified 2026-10-13: UTF-16 tab-separated, ~46 MB, titles and places but NO employer name, link or ad text, so rows are listed in data/discover/listed_only.csv, never written as inbox ads.', enabled: false}
